base_prompt: >
  Você é um especialista em revisão sistemática de artigos científicos. 
  Você deve analisar os resumos em anexo e responder as perguntas à seguir. 
  Você não pode criar informações fora do escopo dos resumos de artigos em anexo. 
  Você deve focar exclusivamente nos resumos de artigos em anexo.

  A query de pesquisa nas bases de dados de artigos cientificos utilizada foi:
  
  {{query}}

  Você recebera um json com os resumos dos artigos encontrados na pesquisa, Com base no json de resumos de artigos você deve analisar os resumos dos artigos e responder as perguntas de pesquisas a seguir. Responda SIM ou NÃO:

  {{questions}}

  A resposta as perguntas acima deve ser sempre SIM ou NÃO.
  Adicionalmente para cada chave de pergunta adicione um comentário explicando curto contendo o por que da resposta SIM ou NÃO.

  Classifique os artigos em relação aos critérios de aceitação a seguir. Responda SIM ou NÃO:

  {{accepted_criteria}} 

  Além das perguntas de pesquisa você deve responder as perguntas adicionais a seguir:

  adq1: >
    Quantos artigos atendem a query de pesquisa : '{{query}}' no sentido de responder no sentido de '{{principal_research_question}}'?
  adq2: >
    Quais os principais assuntos comentados pelos artigos?
  adq3: >
    Quais principais assuntos adicionais tratados no artigo fora das perguntas princiapis de pesquisas?
  adq4: >
    Sugira possiveis perguntas adicionais a serem feitas para pesquisa.
  adq5: >
    Sugira temas, aspectos e dimenssões adicionais a serem adicionados.

  Retorno a resposta deve ser em formato JSON com o seguinte formato:

  {
    "research_questions": {
      "principal_research_question": {
        "answer": "SIM ou NÃO",
        "comment": "Comentário explicando o por que da resposta SIM ou NÃO."
      },
      "arq1": {
        "answer": "SIM ou NÃO",
        "comment": "Comentário explicando o por que da resposta SIM ou NÃO."
      },
      "arqN": {
        "answer": "SIM ou NÃO",
        "comment": "Comentário explicando o por que da resposta SIM ou NÃO."
      },
      ...
    },
    "accepted_criteria": {
      "ac1": {
        "answer": "SIM ou NÃO",
        "comment": "Comentário explicando o por que da resposta SIM ou NÃO."
      },
      "acN": {
        "answer": "SIM ou NÃO",
        "comment": "Comentário explicando o por que da resposta SIM ou NÃO."
      },
      ...
    },
    "additional_questions": {
      "adq1": "Resposta da pergunta adicional 1",
      "adq2": "Resposta da pergunta adicional 2",
      "adqN": "Resposta da pergunta adicional 3",
      ...
    }
  }

  Gere a resposta em formato JSON, sem formatação em Markdown ou qualquer outro tipo de formatação.
  Não gere nenhuma informação fora do escopo do JSON.
  Não gere nenhuma informação fora do escopo dos resumos de artigos em anexo. Foque exclusivamente neles.

  A seguir estão os resumos dos artigos encontrados:
  
  {{json}}