#################   CONFIGURATIONS FOR MAIN SCRIPT   #################

################ Config paths used in the main script ################
PATH_DATA=".data"
BIB_FILE="OUTPUTS/select_bibs.bib"
DOI_FILE="OUTPUTS/DOIs.txt"
FOLDER_SAVE_PDF="PDFs"
BIB_FILE_DOWNLOAD_PDF="OUTPUTS/relevant_abstract_papers.bib"
PATH_JCR="ImpactFiles/jcr.csv"
PATH_SCIMAGO="ImpactFiles/scimago.csv"

# PDF Reader Configuration
PDF_PRE_SELECTION_FOLDER="PDFs_PreSelection"
PDF_POST_SELECTION_FOLDER="PDFs"

# Markdown Export Configuration
GENERATE_MARKDOWN_OUTPUT=true
MARKDOWN_OUTPUT_FOLDER="PDFs/markdowns"

# Tables Export Configuration (CSV format)
GENERATE_TABLES_OUTPUT=true
TABLES_OUTPUT_FOLDER="PDFs/tables"

# Images Export Configuration (PNG format)
GENERATE_IMAGES_OUTPUT=true
IMAGES_OUTPUT_FOLDER="PDFs/images"

# PDF Processing Configuration (New async processing)
# Maximum number of PDFs to process concurrently (recommended: 3-10)
PDF_MAX_CONCURRENT=5
# Timeout in seconds for processing a single PDF (recommended: 60-120)
PDF_TIMEOUT_SECONDS=60
# Processing mode: "pre" (only pre-selection), "post" (only post-selection), "both" (both folders with deduplication)
PDF_PROCESSING_MODE="both"

#################   CONFIGURATIONS FOR DEPRECATED JOBS   #################
RUN_DEPRECATED_JOBS = 1
PATH_ACM=""
PATH_SPRINGER=""
PATH_INCLUDE_FILE="config/Deprecated/DeprecatedIncludeExclude/Include_Title.txt"
PATH_EXLUDE_FILE="config/Deprecated/DeprecatedIncludeExclude/Exclude_Words.txt"
PATH_EXLUDE_MANUAL_FILE="config/Deprecated/DeprecatedIncludeExclude/Exclude_Manually.txt"


#################   FILTER LLM RESPONSES FOR RELEVANT PAPERS  #################
FILTER_LLM_RESPONSES_ABSTRACT_PATH="OUTPUTS/processed_responses/combined_responses_consolidated.json"
RELEVANT_ABSTRACT_PAPERS_OUTPUT="OUTPUTS/processed_responses/relevant_papers.json"
UNRELEVANT_ABSTRACT_PAPERS_OUTPUT="OUTPUTS/processed_responses/unrelevant_papers.json"
RELEVANT_ABSTRACT_PAPERS_BIBs_OUTPUT="OUTPUTS/relevant_abstract_papers.bib"
FILTER_LLM_CONFIG_PATH="config/filter_accept_results_llm.yaml"
# Planilha de decisão (todos os artigos + selecionado + motivo derivado do filtro SQL).
# Opcional: se ausente, é gerada ao lado de relevant_papers.json como selection_decisions.xlsx.
SELECTION_DECISIONS_EXCEL_OUTPUT="OUTPUTS/processed_responses/selection_decisions.xlsx"

#################   FILTRO FINAL (TRIAGEM POR TEXTO COMPLETO)  #################
