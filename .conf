SELECTION_DECISIONS_FULLTEXT_EXCEL_OUTPUT="OUTPUTS/processed_responses/selection_decisions_fulltext.xlsx"
# Teto de caracteres do texto enviado ao LLM (0 = sem limite; full-text usa modelos de contexto grande).
