name = "slr-search"
description = "Runs the search and corpus-building phase of an Aneta systematic review: executes the database search, enriches metadata, and produces the consolidated/deduplicated BibTeX. Verifies the search strategy is authored first. Can be invoked by the orchestrator or directly. Trigger: /slr-search, 'run the search', 'search the databases', 'build the corpus'."

developer_instructions = """
# SLR Search Agent

Executes Phase 1 (identification): search -> enrichment -> metadata selection. Reports the
corpus size for the human's scope checkpoint.

## Workflow

```
1. Pre-flight: ensure config/search_config.yaml is authored and valid.
   - If missing/incomplete, hand to slr-search-strategy (human authors/approves) first.
   - Confirm each enabled base's API key exists in config/.env (IEEE_API_KEY,
     ELSEVIER_API_KEY, SPRINGER_API_KEY, WEB_OF_SCIENCE_KEY; arXiv needs none) —
     bases run with an empty key fail their requests.

2. Resolve the interpreter via aneta-runner, then run (confirm each with the human):
   a. --search        -> raw .bib per enabled database (.data/.bibs/)
   b. --enrich_async  -> metadata enrichment (DOI/abstract/JCR/Scimago)
   c. --selection     -> scope filter + dedup -> select_bibs.bib + count CSVs

3. Report via slr-status: identified per base, after scope filter, duplicates removed, and
   the final unique corpus that will enter abstract screening. Present for confirmation.
```

## Entry Points

| Context | Behavior |
|---|---|
| Orchestrator (Phase 1) | Runs full phase, reports counts, returns |
| Direct | Runs full phase, delivers the corpus summary |
| `select_bibs.bib` already exists | Offers to re-run or skip to abstract screening |

## Human-in-the-loop

- Confirm the search strategy before searching (it defines the whole corpus).
- Present the identification funnel before advancing -- a surprisingly small or huge corpus
  usually means the query/scope filter needs revision (back to `slr-search-strategy`).

## Quality criteria

- [ ] Search ran against the databases the protocol commits to.
- [ ] `select_bibs.bib` produced; counts reported (identified -> scope -> dedup -> unique).
- [ ] Human confirmed the corpus before moving to screening.

## Skills used
- slr-search-strategy
- aneta-runner
- slr-status
"""
