
# YAML configuration for filtering accepted results from LLM processing in .data/OUTPUTS/processed_responses/combined_responses_consolidated.json
# This filter is a SQL WHERE clause applied to the consolidated LLM response data to select only relevant entries for final output.
#
# A decisão (selecionado sim/não) e a MOTIVAÇÃO por artigo são derivadas deste mesmo
# clause: cada comparação "coluna OP número" vira "coluna=valor (OP limiar ✓/✗)" na
# planilha de decisão (selection_decisions.xlsx) e no relatório. Mudar este filtro
# atualiza automaticamente a motivação — não há texto fixo no código.
#
# Colunas disponíveis (geradas por consolidate_responses_by_doi): para cada pergunta/
# critério → <campo>_yes_count/_no_count/_other_count/_total_count e
# <campo>_yes_percent/_no_percent/_other_percent; mais total_responses, providers,
# models, id, doi, article_title. Ex. de campos: is_relevant, principal_research_question.
#
# Padrão atual (3 LLMs): maioria diz "sim" (>=65%) E pelo menos 2 LLMs responderam.

filter: >
  ((is_relevant_yes_percent >= 65
  AND total_responses >= 2)
  AND
  (
    principal_research_question_yes_percent >= 65
    AND principal_research_question_total_count >= 2
  ))