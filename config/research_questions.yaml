principal_research_question: >
  What techniques have currently been used as a solution for integrating heterogeneous data?

additional_research_questions:
  arq1: >
    How to generate integrated data models from distributed and heterogeneous databases?

supporting_questions:
  sq1: >
    Does the study directly address heterogeneous data integration or integrated data modeling from databases, i.e., does it answer one of the research questions?
    (Possible classes: Yes; Partially; No)
  sq2: >
    Does the article present the employed technique of the proposed solution in detail?
    (Possible classes: Yes; Partially; No)

rejection_criteria:
  rc1: >
    The study is a secondary study.
  rc2: >
    The study is a secondary study that is not related.
  rc3: >
    False positive.
  rc4: >
    False positive after screening.
  rc5: >
    Published before 2015.
  rc6: >
    Publication is not peer-reviewed.

accepted_criteria:
  ac1: >
    The study aims at integrating heterogeneous data.
  ac2: >
    The study addresses, applies, and discusses the results of applying heterogeneous data integration techniques.
  ac3: >
    The study aims at integrated data modeling from distributed and heterogeneous databases.
  ac4: >
    The study addresses, applies, and discusses the results of applying integrated data modeling techniques on distributed and heterogeneous databases.
