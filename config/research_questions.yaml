principal_research_question: >
  What organizational structures have been proposed in Generative AI multi-agent systems?

additional_research_questions:
  arq1: >
    What are the work coordination patterns for Generative AI multi-agents?

supporting_questions:
  sq1: >
    What are the frameworks that address the organization and work coordination of multi-agents?
  sq2: >
    What are the most used communication patterns between agents?
  sq3: >
    What are the main factors to consider when choosing an organization and work coordination system? Examples (financial and economic factors, security and robustness factors, latency and response time factors, implementation and maintenance complexity factors, other factors to be identified)
  sq4: >
    Are there hybrid multi-agent organizations and coordination systems that include humans? How do they work?

rejection_criteria:
  rc1: >
    Single-Agent Systems: Studies that focus only on single-agent systems are excluded.
  rc2: >
    Non-LLM-Based Systems: Articles on multi-agent systems that do not use LLMs are rejected.
  rc3: >
    Exclusive Focus on Applications: Works that only describe the application of a system without providing details on one of the following: architecture or design patterns, description of work coordination mechanisms, or description of organizational structural patterns of multi-agents.
  rc4: >
    Focus on the Model, Not the System: Articles whose main focus is the training, internal architecture, or fine-tuning of the LLM, rather than the interaction and organization of the agents.

accepted_criteria:
  ac1: >
    The article discusses multi-agent systems that use Large Language Models (LLMs) as their core component and their organizational or work coordination structures.
  ac2: >
    The content discusses the architecture, frameworks, organization, collaboration, or design patterns of multi-agent systems.
  ac3: >
    The article directly addresses at least one of the main or additional research questions of the systematic review.
