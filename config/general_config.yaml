######################## Enrichment options ########################
enrich_bibtex_doi: true
enrich_bibtex_abstract: true
enrich_bibtex_keywords: true
enrich_bibtex_jcr_scimago: true

enrich_arxiv: false



######################## Bibliometry options ########################
bibliometry_using_openalex: true
bibliometry_for_arxiv: false

###### Not implemented yet ######
bibliometry_using_scopus: false 



#################### Download PDF Papers  options ####################
# Cascata de download (ordem de preferência): métodos grátis (Crossref/Unpaywall/OpenAlex)
# -> Playwright (navegador headless, acesso institucional por IP, ex.: VPN) -> PyPaperBot
# (sci-hub, último recurso). Concorrência do Playwright via env DOWNLOAD_BROWSER_CONCURRENT.
enable_playwright_download: true
enable_PyPaperBot_download: true
enable_search_link_file_by_google_scholars: false
enable_save_md_to_lost_papers: true